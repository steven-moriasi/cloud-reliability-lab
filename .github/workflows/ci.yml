name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests
      - run: mypy app tests
      - run: >-
          pytest --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: cloud-reliability-lab:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    runs-on: ubuntu-latest
    env:
      RELIABILITY_LAB_IDLE_TRANSACTION_SECONDS: "5"
      RELIABILITY_LAB_REMEDIATION_INTERVAL_SECONDS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate configuration
        run: |
          docker compose config --quiet
          sh -n scripts/backup.sh
          sh -n scripts/restore_verify.sh
      - name: Start reliability stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Profile query and verify resilience
        run: |
          docker compose run --rm tools -m app.benchmark \
            --rows 50000 --iterations 3 --warmups 1 \
            --output /tmp/query-index-benchmark.json
          curl --fail --silent http://localhost:8003/ready
          curl --fail --silent http://localhost:8003/api/tenants/42/orders/summary |
            jq -e '.source == "database"'
          curl --fail --silent http://localhost:8003/api/tenants/42/orders/summary |
            jq -e '.source == "cache"'
          docker compose run --rm tools -m app.network_faults cache down
          curl --fail --silent http://localhost:8003/api/tenants/42/orders/summary |
            jq -e '.source == "database"'
          docker compose run --rm tools -m app.network_faults database down
          curl --fail --silent http://localhost:8003/api/tenants/42/orders/summary |
            jq -e '.source == "stale"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8003/api/tenants/43/orders/summary)" = "503"
          docker compose run --rm tools -m app.network_faults database up
          docker compose run --rm tools -m app.network_faults cache up
      - name: Verify scoped remediation and restore
        run: |
          timeout 25 docker compose run --rm tools \
            -m app.faults idle-transaction --seconds 30 |
            grep 'was terminated by the remediation agent'
          test "$(docker compose exec -T db psql -U reliability -d reliability -Atc \
            "SELECT COUNT(*) FROM remediation_events WHERE outcome = 'terminated'")" -ge 1
          ./scripts/backup.sh
          ./scripts/restore_verify.sh
          curl --fail --silent http://localhost:8003/metrics |
            grep reliability_lab_summary_requests_total
          curl --fail --silent http://localhost:9103/metrics |
            grep reliability_lab_remediations_total
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop reliability stack
        if: always()
        run: docker compose down --volumes
